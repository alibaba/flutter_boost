name: flutter_boost
description: A next-generation Flutter-Native hybrid solution. FlutterBoost is a Flutter plugin which enables hybrid integration of Flutter for your existing native apps with minimum efforts.
version: 5.0.2

homepage: https://github.com/alibaba/flutter_boost

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.16.0
  flutter_boost_platform_interface:
    path: flutter_boost_platform_interface
  flutter_boost_android:
    path: flutter_boost_android
  flutter_boost_ios:
    path: flutter_boost_ios

dev_dependencies:
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter
  pigeon: ^3.2.9

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_boost_android
      ios:
        default_package: flutter_boost_ios
