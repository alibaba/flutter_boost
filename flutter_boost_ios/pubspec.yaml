name: flutter_boost_ios
description: iOS implementation of the flutter_boost plugin.
version: 5.0.2
homepage: https://github.com/alibaba/flutter_boost

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_boost_platform_interface:
    path: ../flutter_boost_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  plugin:
    implements: flutter_boost
    platforms:
      ios:
        pluginClass: FlutterBoostPlugin
